[package]
name = "washi-font-spikes"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway font-manager spikes S1-S4 (ADR 0003). Not part of the product."

[dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-software", "raw-window-handle-06",
    "unstable-fontique-011", "unstable-winit-030",
] }
skrifa = "0.44"
write-fonts = "0.50"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }
raw-window-handle = "0.6"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_System_Ole",
    "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader", "Win32_Graphics_Gdi", "Win32_System_Memory",
] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
