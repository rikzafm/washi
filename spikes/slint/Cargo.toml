[package]
name = "washi-spikes"
version = "0.0.0"
edition = "2021"
publish = false
description = "Throwaway Phase-0 rendering spikes (ticket 01). Not part of the product."

[features]
default = []
winit = ["slint/backend-winit"]
accessibility = ["slint/accessibility"]
bench = ["dep:png"]

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts"] }
png = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader",
] }

[build-dependencies]
slint-build = "1.18"

[[bin]]
name = "winit_win"
required-features = ["winit"]

[[bin]]
name = "render_bench"
required-features = ["bench"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace]
