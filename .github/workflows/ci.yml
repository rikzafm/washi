name: ci
on: [push, pull_request]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Git's Cygwin Perl breaks OpenSSL's Configure; use Strawberry Perl first on PATH.
      - run: echo "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
        shell: pwsh
      - run: cargo test --workspace
      # uidiff is outside the workspace (own lockfile): test it separately
      - run: cargo test --manifest-path tools/uidiff/Cargo.toml
      # the fidelity loop, headless: snap the note, compare with the mockups, check the size
      # invariants. Fails on any regression against docs/design/fidelity-baseline.txt (for example
      # a title that moved by 3 px) and uploads the reports either way.
      - run: pwsh tools/fidelity.ps1 -NoOpen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fidelity
          path: target/fidelity/
      - run: cargo build --release -p washi
      - run: pwsh tools/check-release.ps1
      # check-release also enforces the 8 MB, no-DLL binary budget (G5)
      # memory budgets: 3 notes <= 15 MB active and <= 5 MB suspended, <= 2 MB per extra note,
      # wake <= 50 ms. Startup (150 ms) is measured by tools/memprobe.ps1 -Startup on a
      # developer machine: shared runners are too noisy for a 150 ms gate.
      - run: cargo build --release -p snap --bin seed
      - run: pwsh tools/memprobe.ps1 -Notes 1,3 -IdleSec 5 -Suspended -Enforce -NoLog
