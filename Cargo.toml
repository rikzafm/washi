[workspace]
resolver = "2"
members = ["washi", "tools/snap"]
# Not part of the product build: uidiff keeps its own lockfile; spikes are throwaway.
exclude = ["tools/uidiff", "tools/tapegen", "spikes/slint", "spikes/sqlcipher", "spikes/fonts"]
default-members = ["washi"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Debug builds still optimize the dependencies: Slint's software renderer draws every frame on the
# CPU, and unoptimized it is slow enough to make every animation stutter in `cargo run`.
[profile.dev.package."*"]
opt-level = 2
