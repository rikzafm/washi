[workspace]
resolver = "2"
members = ["washi", "tools/snap"]
# Not part of the product build: uidiff keeps its own lockfile; spikes are throwaway.
exclude = ["tools/uidiff", "spikes/slint", "spikes/sqlcipher"]
default-members = ["washi"]

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
