[package]
name = "washi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Washi Note: lightweight encrypted sticky notes for Windows"
license = "MIT"
build = "build.rs"

[lib]
name = "washi"
path = "src/lib.rs"

[[bin]]
name = "washi"
path = "src/main.rs"

[features]
default = ["accessibility"]
accessibility = ["slint/accessibility"]
# Keeps the work counters of `trace::counts` (`Layout::build`, `textflow::wrap`, document clones and
# the like) for tools/snap's layout benchmark and the tests that pin them.
trace = []

[dependencies]
# Software renderer on winit (ADR 0001). No GPU renderer features, ever (CI-checked).
# Fonts are embedded (ui/block.slint imports fonts/*.ttf); no system font is needed for Latin text.
# (slint 1.18 turns on the renderer's system-font support with `std`; it is only a fallback.)
slint = { version = "1.18", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-software",
    "raw-window-handle-06",
] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
base64 = "0.23"
# Line-break opportunities (UAX #14), as Slint's text layout uses (already in the tree through Slint).
unicode-linebreak = "0.1"
# Advances of the embedded fonts, for the stepped text layout (already in the tree through Slint).
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
raw-window-handle = "0.6"
# Font engine (ADR 0003): outlines at a variation location, a TrueType writer, a zip reader.
skrifa = "0.44"
write-fonts = "0.50"
zip = { version = "2", default-features = false, features = ["deflate"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Media",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Memory",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_Security",
] }
jpeg-encoder = "0.6"
png = "0.17"
zune-jpeg = "0.5"
zune-core = "0.5"

[build-dependencies]
slint-build = "1.18"

[dev-dependencies]
tempfile = "3"
# Reads variable fonts at a location: the independent source of truth for the baked advances.
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout", "variable-fonts"] }
