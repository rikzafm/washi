[package]
name = "washi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Washi: lightweight encrypted sticky notes for Windows"
license = "MIT"
build = "build.rs"

[lib]
name = "washi"
path = "src/lib.rs"

[[bin]]
name = "washi"
path = "src/main.rs"

[features]
default = ["accessibility"]
accessibility = ["slint/accessibility"]

[dependencies]
# Software renderer on winit (ADR 0001). No GPU renderer features, ever (CI-checked).
# `software-renderer-systemfonts` is a placeholder until ticket 03 embeds fonts.
slint = { version = "1.18", default-features = false, features = [
    "std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-systemfonts",
    "raw-window-handle-06",
] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
zeroize = "1"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls_Dialogs",
] }

[build-dependencies]
slint-build = "1.18"
