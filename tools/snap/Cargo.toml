[package]
name = "snap"
version = "0.1.0"
edition = "2021"
publish = false
description = "Dev-only app harness: runs the whole Washi app on a stand-in platform with fakes for Windows"

[dependencies]
washi = { path = "../../washi" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "renderer-software"] }
tempfile = "3"
